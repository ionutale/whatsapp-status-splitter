<svg
	xmlns="http://www.w3.org/2000/svg"
	width="512"
	height="512"
	viewBox="0 0 512 512"
	role="img"
	aria-label="WhatsApp Status Splitter"
>
	<title>WhatsApp Status Splitter</title>
	<!-- Full-bleed background so the icon is valid as a maskable icon. -->
	<rect width="512" height="512" fill="#1d232a" />
	<!-- Film cell: light frame with a dark viewing window. -->
	<rect x="72" y="104" width="368" height="304" rx="52" fill="#ecf9ff" />
	<rect x="124" y="156" width="264" height="200" rx="28" fill="#1d232a" />
	<!-- Sprocket holes, punched out of the light frame margins. -->
	<path
		d="M140 120h32v24h-32zM188 120h32v24h-32zM292 120h32v24h-32zM340 120h32v24h-32z"
		fill="#1d232a"
	/>
	<path
		d="M140 368h32v24h-32zM188 368h32v24h-32zM292 368h32v24h-32zM340 368h32v24h-32z"
		fill="#1d232a"
	/>
	<!-- Split: the clip is divided in two. -->
	<rect x="247" y="104" width="18" height="304" rx="9" fill="#605dff" />
</svg>
